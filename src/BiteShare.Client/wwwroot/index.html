<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BiteShare</title>
    <meta name="theme-color" content="#FFC72C" />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Triggers a browser download from bytes handed over by .NET (used for the
        // itemized PDF receipt, which needs an authenticated fetch rather than a
        // plain <a href> — a bare link wouldn't carry the Bearer token).
        window.biteShareDownloadFile = (fileName, base64Bytes, contentType) => {
            const bytes = atob(base64Bytes);
            const buffer = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);
            const blob = new Blob([buffer], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
