name: Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish src/BiteShare.Api -c Release -o ./publish

      - name: Publish Client
        run: dotnet publish src/BiteShare.Client -c Release -o ./client-publish
        
      - name: Copy Client to API wwwroot
        run: |
          mkdir -p ./publish/wwwroot
          cp -r ./client-publish/wwwroot/. ./publish/wwwroot/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

# NOTE: this file was missing from both source archives despite being referenced
# in README.md ("CI/CD") and CODEOWNERS ("Deployment" -> @Priscilla). This is a
# starter workflow filling that gap — confirm the app name / publish-profile
# secrets and Azure App Service settings with whoever owns deployment.
