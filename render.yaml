# Render Blueprint: one Docker web service (API + Blazor client) and a Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: biteshare
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biteshare-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true

databases:
  - name: biteshare-db
    plan: free
